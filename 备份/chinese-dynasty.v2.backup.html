        detail: '周公还政后，成王营建洛邑、大封诸侯；康王继之，继续推行礼乐教化。史载“成康之际，天下安宁，刑错四十余年不用”，是先秦典籍中理想治世的典范。',
        impact: '与文景、贞观并列，成为中国传统政治的最高治世标杆之一。' },
      { id: 'e51', year: -841, period: '西周', shortTitle: '国人暴动', title: '国人暴动与共和行政', category: '政治变革', figure: '周厉王、召穆公、周定公',
        desc: '厉王专利山泽、监谤弭言，镐京国人起义将其驱逐，共和行政开始。',
        detail: '周厉王任用荣夷公“专利”，把山林川泽之利收归王室，又以卫巫监视议政者，国人道路以目。前841年国人暴动，厉王奔彘，太子静赖召公藏于其家得免，朝政由周定公、召穆公共同执掌，史称“共和行政”。',
        impact: '中国历史确切纪年的开端（前841年起），也是民变制约王权的标志事件。' },
      { id: 'e52', year: -800, period: '西周', shortTitle: '宣王中兴', title: '宣王中兴与千亩之败', category: '政治变革', figure: '周宣王、尹吉甫、召虎',
        desc: '宣王任用尹吉甫、召虎北伐猃狁、南征荆楚，一度重振周室。',
        detail: '共和十四年厉王死于彘，宣王即位，修政恤民、整顿军旅。他派尹吉甫击退猃狁至太原，召虎平定淮夷，又“料民于太原”补充兵源。但晚年千亩之战大败于姜戎，中兴之势转衰。',
        impact: '西周最后的回光返照，其失败直接通向幽王亡国。' },

      // ---------- 春秋战国 ----------
      { id: 'e53', year: -679, period: '春秋', shortTitle: '齐桓称霸', title: '齐桓公尊王攘夷首霸', category: '政治变革', figure: '齐桓公、管仲',
        desc: '齐桓公任用管仲改革，打出“尊王攘夷”旗号，于鄄地会盟成为首位霸主。',
        detail: '管仲推行“叁其国而伍其鄙”、军政合一与盐铁官营，齐国迅速富强。齐桓公北救燕、南遏楚，前656年率八国联军伐楚订召陵之盟，前651年葵丘会盟周天子赐胙，霸业达到顶点。',
        impact: '确立“尊王攘夷”的霸权秩序，开启春秋五霸时代。' },
      { id: 'e54', year: -632, period: '春秋', shortTitle: '城濮之战', title: '城濮之战与践土会盟', category: '军事风云', figure: '晋文公、先轸、子玉',
        desc: '晋文公退避三舍诱敌深入，在城濮大败楚军，践土会盟称霸。',
        detail: '楚成王围宋，晋文公出兵救宋并攻曹、卫以诱楚。两军遇于城濮，晋军兑现当年流亡时许下的“退避三舍”承诺后撤九十里，再以虎皮蒙马冲击楚军右翼，楚师溃败。战后晋文公在践土会盟诸侯，周襄王亲临册命。',
        impact: '晋国百年霸业的开端，也留下了“退避三舍”的成语典故。' },
      { id: 'e55', year: -522, period: '春秋', shortTitle: '孔子设教', title: '孔子设帐授徒有教无类', category: '文明盛世', figure: '孔子、颜回、子路',
        desc: '孔子在曲阜设帐授徒，首开私人讲学之风，相传弟子三千、贤者七十二。',
        detail: '孔子早年任委吏、乘田，三十岁前后开始聚徒讲学，主张“有教无类”，以诗书礼乐教授，弟子多出身寒微。他后来周游列国十四年不遇，晚年返鲁整理六经，言行由弟子辑为《论语》。',
        impact: '打破贵族对教育的垄断，奠定儒家学派与东亚文教传统。' },
      { id: 'e56', year: -260, period: '战国', shortTitle: '长平之战', title: '长平之战白起坑赵卒', category: '军事风云', figure: '白起、赵括、廉颇',
        desc: '秦赵决战长平，白起坑杀赵军四十余万，赵国自此一蹶不振。',
        detail: '秦攻上党，赵将廉颇筑垒坚守，秦用反间计使赵王以赵括代廉颇。赵括改守为攻，被白起分割包围四十六日，赵军粮尽投降，白起尽坑之。此战秦军亦伤亡过半，但山东六国再无力独抗强秦。',
        impact: '战国史上规模最大的歼灭战，秦统一天下的军事格局由此奠定。' },
      { id: 'e57', year: -256, period: '战国·秦', shortTitle: '都江堰成', title: '李冰筑都江堰泽被天府', category: '文明盛世', figure: '李冰、李二郎',
        desc: '秦蜀守李冰父子主持修建都江堰，成都平原自此“水旱从人”，号为天府。',
        detail: '李冰在岷江出山口凿离堆、开宝瓶口，以鱼嘴分水、飞沙堰排洪，形成无坝引水的自流灌溉系统。工程历经两千余年仍在运转，灌溉面积今逾千万亩。',
        impact: '世界水利史上的活化石，直接塑造了“天府之国”的经济基础。' },

      // ---------- 秦 ----------
      { id: 'e58', year: -214, period: '秦朝', shortTitle: '万里长城', title: '蒙恬北逐匈奴筑长城', category: '军事风云', figure: '蒙恬、扶苏、秦始皇',
        desc: '秦始皇命蒙恬北逐匈奴，连接燕赵秦旧长城，筑起西起临洮的万里长城。',
        detail: '前215年蒙恬率三十万大军北击匈奴，收复河南地（河套），设九原郡。随后依山就险，把秦、赵、燕三国旧长城连缀修缮，西起临洮、东至辽东，延袤万里，并修直道自咸阳通九原。',
        impact: '首次形成中原农耕文明对抗游牧的完整防线，长城从此成为中国的文化符号。' },
      { id: 'e59', year: -213, period: '秦朝', shortTitle: '焚书坑儒', title: '焚书坑儒与思想专制', category: '政治变革', figure: '秦始皇、李斯、淳于越',
        desc: '秦始皇采李斯之议焚毁民间诗书百家语，次年坑杀方士儒生四百六十余人。',
        detail: '前213年博士淳于越主张恢复分封，李斯驳斥并建议禁私学、焚《诗》《书》与百家语，仅留医药卜筮种树之书，令下三十日不烧者黥为城旦。次年因方士侯生、卢生逃亡，始皇下令追查诽谤者，坑杀四百六十余人于咸阳。',
        impact: '中国思想史上第一次大规模文化摧残，成为秦二世而亡的舆论口实。' },
      { id: 'e60', year: -210, period: '秦朝', shortTitle: '沙丘之变', title: '沙丘之变与秦政崩坏', category: '政治变革', figure: '赵高、李斯、胡亥、扶苏',
        desc: '始皇崩于沙丘，赵高胁迫李斯矫诏立胡亥、赐死扶苏与蒙恬。',
        detail: '前210年始皇东巡途中病逝沙丘平台，遗诏令长子扶苏回咸阳主持丧事。中车府令赵高扣下诏书，说服丞相李斯秘不发丧，另造假诏立少子胡亥为太子，并赐扶苏、蒙恬死。扶苏自杀，秦政自此落入赵高之手。',
        impact: '秦朝速亡的直接导火索，也是“宦官干政”的历史原点。' },
      { id: 'e61', year: -209, period: '秦朝', shortTitle: '大泽乡起义', title: '陈胜吴广揭竿而起', category: '军事风云', figure: '陈胜、吴广',
        desc: '陈胜、吴广率戍卒在大泽乡起兵，喊出“王侯将相宁有种乎”。',
        detail: '九百戍卒被征发渔阳，途遇大雨失期当斩。陈胜、吴广杀将尉起事，诈称扶苏、项燕，攻占陈县后建“张楚”政权。起义虽在半年内失败，但六国旧贵族与刘邦、项羽等纷纷响应。',
        impact: '中国历史上第一次大规模农民起义，推翻秦朝的第一声号角。' },
      { id: 'e62', year: -207, period: '秦朝', shortTitle: '巨鹿之战', title: '项羽破釜沉舟败秦军', category: '军事风云', figure: '项羽、章邯、王离',
        desc: '项羽破釜沉舟，以数万楚军击溃秦军主力四十万，诸侯皆属。',
        detail: '秦将章邯围赵于巨鹿，楚怀王派宋义、项羽救援。项羽斩宋义夺军，渡漳水后凿沉船只、打破釜甑、只带三日粮，九战九捷，俘王离、降章邯。战后诸侯将入辕门皆膝行而前，项羽成为反秦联军领袖。',
        impact: '秦军主力覆灭，秦亡进入倒计时；“破釜沉舟”成为决死一战的代名词。' },

      // ---------- 西汉 ----------
      { id: 'e63', year: -200, period: '西汉', shortTitle: '白登之围', title: '白登之围与汉匈和亲', category: '军事风云', figure: '刘邦、冒顿单于、陈平',
        desc: '刘邦北征匈奴被围白登山七日，以和亲纳贡换取边境安定。',
        detail: '韩王信降匈奴后，刘邦亲率三十二万大军北击，轻敌冒进至平城白登山，被冒顿四十万骑围困七日，粮尽援绝。陈平以重金贿赂阏氏，加之雾气掩护，刘邦方得脱围。此后汉廷对匈奴行和亲、岁贡之策。',
        impact: '汉初六十年对匈守势的起点，也埋下武帝反击的伏笔。' },
      { id: 'e64', year: -180, period: '西汉', shortTitle: '文景之治', title: '文景之治与与民休息', category: '文明盛世', figure: '汉文帝、汉景帝、贾谊、晁错',
        desc: '文帝、景帝轻徭薄赋、与民休息，田租减至三十税一，国力迅速恢复。',
        detail: '文帝屡减田租、算赋，开放山林川泽，废肉刑、纳谏言；景帝平定七国之乱后收诸侯王治国权。至武帝初年，京师之钱累巨万、太仓之粟陈陈相因。',
        impact: '中国帝制时代第一个公认的治世，为汉武开边提供了物质基础。' },
      { id: 'e65', year: -134, period: '西汉', shortTitle: '独尊儒术', title: '罢黜百家独尊儒术', category: '文明盛世', figure: '汉武帝、董仲舒',
        desc: '武帝采纳董仲舒之议罢黜百家、表章六经，儒学成为国家意识形态。',
        detail: '董仲舒在《天人三策》中提出“诸不在六艺之科、孔子之术者，皆绝其道”，主张以《春秋》决狱、兴太学养士。武帝设五经博士、立太学，儒学自此与选官制度绑定。',
        impact: '奠定两千年“儒表法里”的帝国治理结构，影响远超一朝一代。' },
      { id: 'e66', year: -119, period: '西汉', shortTitle: '卫霍破匈', title: '卫青霍去病漠北大捷', category: '军事风云', figure: '卫青、霍去病、汉武帝',
        desc: '卫青、霍去病分道出塞，漠北大破匈奴，封狼居胥，匈奴远遁。',
        detail: '前119年武帝倾国之力发骑兵十万、私负从马十四万匹，卫青出定襄、霍去病出代郡，深入漠北千余里。卫青破单于本部，霍去病歼左贤王部七万余人，封狼居胥山而还。此后“漠南无王庭”。',
        impact: '扭转汉匈攻守之势，打通河西走廊与西域通道。' },
      { id: 'e67', year: -33, period: '西汉', shortTitle: '昭君出塞', title: '昭君出塞与汉匈和好', category: '对外开拓', figure: '王昭君、呼韩邪单于、汉元帝',
        desc: '宫女王昭君远嫁匈奴呼韩邪单于，汉匈间维持六十余年和平。',
        detail: '前33年呼韩邪单于入朝求亲，昭君自请出嫁，被封为宁胡阏氏。她先后嫁父子两代单于，其子女与部众活跃于汉匈交往之中，边地“边城晏闭，牛马布野”。',
        impact: '中国古代和亲史上最著名的个案，也是民族交融的象征。' },
      { id: 'e68', year: 8, period: '新朝', shortTitle: '王莽代汉', title: '王莽代汉建新与托古改制', category: '政治变革', figure: '王莽、孺子婴',
        desc: '外戚王莽以“禅让”之名代汉建新，托古改制，十五年后覆亡。',
        detail: '王莽借外戚身份与“安汉公”声望逐步专权，公元8年废孺子婴自立，国号“新”。他推行王田制、禁止奴婢买卖、五均六筦、屡改币制，法禁烦苛且朝令夕改，加之黄河改道，天下大乱。',
        impact: '中国帝制史上第一次“禅让”篡位样本，其失败使托古改制长期成为政治禁忌。' },

      // ---------- 东汉 ----------
      { id: 'e69', year: 17, period: '新朝', shortTitle: '绿林赤眉', title: '绿林赤眉起义与新朝覆灭', category: '军事风云', figure: '王匡、樊崇、刘玄',
        desc: '新莽末年绿林、赤眉两军并起，天下大乱，新朝覆灭。',
        detail: '荆州饥民入绿林山起义，号“绿林军”；东方樊崇聚众以朱涂眉，号“赤眉”。22年绿林军立刘玄为更始帝，次年在昆阳以少胜多击溃王莽主力，随后攻入长安，新朝亡。',
        impact: '为东汉建立扫清道路，也使“绿林”成为后世江湖草莽的代称。' },
      { id: 'e70', year: 70, period: '东汉', shortTitle: '明章之治', title: '明章之治与佛教东传', category: '文明盛世', figure: '汉明帝、汉章帝、王景',
        desc: '明帝、章帝承光武之业，吏治严明、轻徭薄赋，佛教亦于此时东传。',
        detail: '明帝严察吏治、命王景治理黄河，派班超经营西域，并于永平年间遣使求法，建白马寺，佛教正式传入中土。章帝召开白虎观会议，编定《白虎通义》，统一经义。',
        impact: '东汉国力与文教的鼎盛期，也是佛教中国化的起点。' },
      { id: 'e71', year: 73, period: '东汉', shortTitle: '班超西行', title: '班超投笔从戎经营西域', category: '对外开拓', figure: '班超、甘英、班勇',
        desc: '班超以三十六人出使西域，经营三十一年，使五十余国复归汉廷。',
        detail: '班超投笔从戎，随窦固出击匈奴后出使鄯善，夜袭匈奴使团震慑鄯善王。此后他在于阗、疏勒等地连破亲匈势力，91年任西域都护，还派甘英西行至条支（波斯湾），试图联络大秦。',
        impact: '重续丝绸之路，是古代中国最富传奇色彩的边疆经营。' },
      { id: 'e72', year: 166, period: '东汉', shortTitle: '党锢之祸', title: '党锢之祸与清流覆灭', category: '政治变革', figure: '汉桓帝、李膺、陈蕃',
        desc: '宦官集团两次兴狱，大批清流名士被禁锢终身，东汉政治自此崩坏。',
        detail: '桓帝时宦官单超等助诛梁冀，权势熏天。士大夫李膺、陈蕃等抨击宦官，太学生三万余人清议支持，被诬“共为部党”。166年、169年两次大狱，李膺等百余人死于狱中，受牵连者数百，党人门生故吏皆禁锢。',
        impact: '士族与皇权、宦官的裂痕无法弥合，为汉末大乱埋下伏笔。' },
      { id: 'e73', year: 184, period: '东汉', shortTitle: '黄巾起义', title: '黄巾起义与州牧割据', category: '军事风云', figure: '张角、张宝、张梁',
        desc: '太平道张角以“苍天已死，黄天当立”为号，八州同时起兵。',
        detail: '张角以符水治病传教十余年，徒众数十万，分三十六方。原定184年三月五日起事，因弟子告密提前举兵，头裹黄巾，燔烧官府，旬月之间天下响应。汉廷解除党禁、允许州郡募兵，最终由皇甫嵩、曹操等镇压。',
        impact: '东汉中央权威彻底瓦解，州牧割据与三国格局由此发端。' },
      { id: 'e74', year: 200, period: '汉末三国', shortTitle: '官渡之战', title: '官渡之战曹操破袁绍', category: '军事风云', figure: '曹操、袁绍、荀彧、许攸',
        desc: '曹操以两万之众奇袭乌巢，大破袁绍十万大军，奠定统一北方之基。',
        detail: '200年袁绍率大军南下，曹操兵少粮缺，坚守官渡。许攸叛投献计，曹操亲率五千步骑夜袭乌巢粮仓，焚烧辎重，袁军全线崩溃，仅余八百骑北逃。此后曹操尽收河北。',
        impact: '中国军事史上以少胜多的经典，北方统一格局由此确立。' },

      // ---------- 三国 ----------
      { id: 'e75', year: 222, period: '三国·蜀汉', shortTitle: '夷陵之战', title: '夷陵之战陆逊火烧连营', category: '军事风云', figure: '刘备、陆逊、孙权',
        desc: '刘备为关羽复仇东征，陆逊火烧连营七百里，蜀汉元气大伤。',
        detail: '221年刘备称帝后亲率大军伐吴，孙权求和不成，任陆逊为大都督。陆逊坚守不战，待蜀军酷暑移营山林，以火攻破四十余营，刘备退守白帝城，次年病逝。',
        impact: '三国三大战役的终局，蜀汉从此只能困守益州。' },
      { id: 'e76', year: 228, period: '三国·蜀汉', shortTitle: '诸葛北伐', title: '诸葛亮六出祁山北伐', category: '军事风云', figure: '诸葛亮、司马懿、姜维',
        desc: '诸葛亮六出祁山北伐曹魏，鞠躬尽瘁，病逝五丈原。',
        detail: '227年诸葛亮上《出师表》，次年出祁山，南安、天水、安定三郡响应，但因马谡失街亭而退。此后屡出散关、五丈原，与司马懿对峙百余日，234年积劳成疾卒于军中。',
        impact: '“鞠躬尽瘁，死而后已”成为忠臣典范，也让蜀汉北伐成为千古悲壮叙事。' },
      { id: 'e77', year: 249, period: '三国·曹魏', shortTitle: '高平陵变', title: '高平陵之变司马氏夺权', category: '政治变革', figure: '司马懿、曹爽、曹芳',
        desc: '司马懿趁曹爽陪帝出城发动政变，尽诛曹爽集团，曹魏实权尽归司马氏。',
        detail: '魏明帝托孤曹爽、司马懿，曹爽排挤司马懿，使其称病不出。249年正月，曹爽兄弟陪少帝曹芳谒高平陵，司马懿闭洛阳城门、占据武库，指曹爽“背弃顾命”，诱其交权后夷其三族。',
        impact: '魏晋禅代的关键一步，也确立“政变夺权”的魏晋政治范式。' },

      // ---------- 两晋十六国 ----------
      { id: 'e78', year: 291, period: '西晋', shortTitle: '八王之乱', title: '八王之乱与西晋自毁', category: '政治变革', figure: '贾南风、司马伦、司马颖、司马越',
        desc: '西晋宗室八王为争权相互攻杀十六年，中原残破，国力耗尽。',
        detail: '晋惠帝愚钝，皇后贾南风干政，先借楚王司马玮杀汝南王亮、卫瓘，又以“矫诏”罪诛玮，后毒杀太子。赵王伦废帝自立，齐王冏、成都王颖、河间王颙、长沙王乂、东海王越相继起兵。',
        impact: '西晋统一仅二十年即自毁，直接引发五胡入主中原。' },
      { id: 'e79', year: 311, period: '西晋', shortTitle: '永嘉之乱', title: '永嘉之乱与西晋覆亡', category: '军事风云', figure: '刘曜、石勒、晋怀帝',
        desc: '匈奴刘曜攻破洛阳，俘晋怀帝，屠戮宗室百官，西晋名存实亡。',
        detail: '刘渊建汉称帝，其子刘聪继位后派刘曜、石勒大举南下。311年刘曜攻陷洛阳，发掘陵墓、焚毁宫庙，俘怀帝及宗室大臣三万余人北迁。316年长安陷落，愍帝出降，西晋亡。',
        impact: '中原士族大规模南迁，中国政治中心首次长时期南移。' },
      { id: 'e80', year: 313, period: '东晋', shortTitle: '祖逖北伐', title: '祖逖击楫中流誓师北伐', category: '军事风云', figure: '祖逖、刘琨',
        desc: '祖逖击楫中流誓师北伐，收复黄河以南，终因朝廷猜忌忧愤而卒。',
        detail: '永嘉之乱后祖逖率宗族部曲数百家南渡，313年向司马睿请命北伐，仅得千人粮饷。渡江于中流击楫而誓，进军谯城，招抚坞堡，数年间黄河以南尽为晋有。后因朝廷派戴渊节制，忧愤成疾卒于雍丘。',
        impact: '“闻鸡起舞”“击楫中流”成为民族复兴意志的象征符号。' },
      { id: 'e81', year: 354, period: '东晋', shortTitle: '桓温北伐', title: '桓温三次北伐与枋头之败', category: '军事风云', figure: '桓温、慕容垂',
        desc: '东晋权臣桓温三次北伐，一度收复洛阳，终在枋头大败于前燕。',
        detail: '桓温灭成汉后声望大振，354年率军入关中、败前秦军于蓝田，因粮尽退兵；356年收复洛阳；369年北伐前燕至枋头，被慕容垂断粮道，死者三万。',
        impact: '门阀政治的典型样本——北伐既是国事，也是权臣积累资本的工具。' },

      // ---------- 南北朝 ----------
      { id: 'e82', year: 424, period: '南朝·宋', shortTitle: '元嘉之治', title: '元嘉之治与元嘉草草', category: '文明盛世', figure: '宋文帝刘义隆',
        desc: '宋文帝刘义隆在位三十年，轻赋劝农、兴学崇文，江南号称富盛。',
        detail: '文帝整顿吏治、减免赋役，修复芍陂等水利，元嘉年间“役宽务简，氓庶繁息”。但三次北伐失败，尤其450年魏军南下至瓜步，江北残破，元嘉之治由盛转衰。辛弃疾“元嘉草草”即咏此。',
        impact: '南朝最被后世称道的治世，也是南北力量对比的转折点。' },
      { id: 'e83', year: 523, period: '北魏', shortTitle: '六镇起义', title: '六镇起义与河阴之变', category: '军事风云', figure: '破六韩拔陵、葛荣、尔朱荣',
        desc: '北魏北边六镇军民因待遇骤降举兵，演变成长达八年的全国动乱。',
        detail: '孝文帝迁洛后，北边六镇由“国之肺腑”沦为府户，仕进无路。523年沃野镇破六韩拔陵起义，柔然、河北、关陇相继响应，葛荣拥众数十万。尔朱荣借平乱崛起，于河阴尽杀朝士。',
        impact: '直接导致北魏分裂，并催生关陇集团与隋唐统治核心。' },
      { id: 'e84', year: 548, period: '南朝·梁', shortTitle: '侯景之乱', title: '侯景之乱与台城陷落', category: '军事风云', figure: '侯景、梁武帝、陈霸先',
        desc: '降将侯景举兵反梁，攻陷建康，梁武帝饿死台城，江南残破。',
        detail: '侯景原为东魏大将，降梁后因梁与东魏议和被逼反。548年渡江围台城，梁武帝萧衍被困饿死；侯景纵兵掠杀，三吴“千里绝烟”，建康人口十不存一。王僧辩、陈霸先起兵讨景，552年收复建康。',
        impact: '南朝士族遭到毁灭性打击，为陈朝与隋统一铺路。' },
      { id: 'e85', year: 577, period: '北周', shortTitle: '北周灭齐', title: '周武帝灭北齐统一北方', category: '军事风云', figure: '周武帝宇文邕、韦孝宽',
        desc: '周武帝亲征灭北齐，统一北方，为隋代周统一天下奠定基础。',
        detail: '宇文邕诛权臣宇文护后亲政，禁佛道二教、释放寺观人口，府兵制扩及均田农民。575年、576年两次东征，取晋阳、破邺城，577年俘齐后主高纬，北方重归一统。',
        impact: '北方统一与关陇军事集团成型，直接孕育了隋唐帝国。' },

      // ---------- 隋 ----------
      { id: 'e86', year: 581, period: '隋朝', shortTitle: '开皇之治', title: '开皇之治与三省六部', category: '文明盛世', figure: '隋文帝杨坚、高颎、苏威',
        desc: '文帝统一后轻徭薄赋、整顿吏治，仓廪丰实，史称“开皇之治”。',
        detail: '杨坚废北周六官、行三省六部，简化地方行政为州县两级，推行输籍定样、大索貌阅整顿户籍，设常平仓、义仓。至开皇末年户口近九百万，长安、洛阳仓储可支数十年。',
        impact: '三省六部制与均田、府兵结合，成为盛唐制度的直接来源。' },
      { id: 'e87', year: 605, period: '隋朝', shortTitle: '开创科举', title: '隋炀帝始设进士科', category: '文明盛世', figure: '隋炀帝杨广、房玄龄',
        desc: '隋炀帝始建进士科，以考试取士，打破门阀对仕途的垄断。',
        detail: '隋文帝废九品中正制，以分科考试选官；炀帝大业元年设进士科，以试策取人。科举虽在唐代才完备，其制度雏形确立于此。',
        impact: '中国选官制度的历史转折，影响东亚一千三百年。' },
      { id: 'e88', year: 610, period: '隋朝', shortTitle: '大运河通', title: '隋炀帝开凿大运河', category: '文明盛世', figure: '隋炀帝、宇文恺',
        desc: '隋炀帝征发百万民夫开凿贯通南北的大运河，全长两千余公里。',
        detail: '605年起先后开凿通济渠、邗沟、永济渠、江南河，以洛阳为中心，北抵涿郡、南达余杭，沟通海河、黄河、淮河、长江、钱塘江五大水系。工程役夫数百万，“丁男不供，始役妇人”。',
        impact: '中国经济重心南北联结的大动脉，唐以后天下财赋多由此路而进。' },
      { id: 'e89', year: 618, period: '隋朝', shortTitle: '江都兵变', title: '江都兵变与隋室覆亡', category: '政治变革', figure: '宇文化及、隋炀帝',
        desc: '隋炀帝滞留江都，禁军思归哗变，宇文化及缢杀炀帝，隋朝覆亡。',
        detail: '三征高丽失败、民变四起，炀帝避居江都，无意北归。618年三月，虎贲郎将司马德戡等拥宇文化及发动兵变，缢杀炀帝，隋宗室被屠杀殆尽。同年李渊在长安称帝。',
        impact: '隋二世而亡的终局，“其兴也勃焉，其亡也忽焉”的经典案例。' },

      // ---------- 唐 ----------
      { id: 'e90', year: 641, period: '唐朝', shortTitle: '文成入藏', title: '文成公主入藏和亲', category: '对外开拓', figure: '文成公主、松赞干布、禄东赞',
        desc: '文成公主远嫁吐蕃赞普松赞干布，汉藏和亲，唐蕃“和同为一家”。',
        detail: '松赞干布多次请婚，641年太宗以宗女文成公主嫁之。公主携佛像、经典、种子、工匠入藏，主持修建小昭寺，中原的历法、医药、纺织技术随之传入。',
        impact: '唐蕃关系与西藏纳入中华文明圈的起点，也是民族交融的典范。' },
      { id: 'e91', year: 645, period: '唐朝', shortTitle: '玄奘西行', title: '玄奘西行取经与译经', category: '对外开拓', figure: '玄奘',
        desc: '玄奘历时十七年西行取经，携归佛经六百余部，著《大唐西域记》。',
        detail: '629年玄奘私出玉门，经高昌、中亚至天竺，在那烂陀寺从戒贤学法，于曲女城辩经大会无一人敢诘难。645年返长安，译经七十五部、一千三百余卷，并口述《大唐西域记》。',
        impact: '中印文化交流的巅峰，也是研究中亚南亚史地的第一手文献。' },
      { id: 'e92', year: 751, period: '唐朝', shortTitle: '怛罗斯战', title: '怛罗斯之战与造纸西传', category: '军事风云', figure: '高仙芝、阿布·穆斯林',
        desc: '唐军与大食在怛罗斯决战失利，造纸术由此西传。',
        detail: '高仙芝因石国之事率军深入，在怛罗斯（今哈萨克江布尔）与大食军对峙五日，葛逻禄部临阵倒戈，唐军大败，数千人被俘。被俘工匠将造纸术传入撒马尔罕、巴格达，再传至欧洲。',
        impact: '唐朝在中亚扩张的终点，却意外推动了世界文明进程。' },
      { id: 'e93', year: 780, period: '唐朝', shortTitle: '两税法行', title: '杨炎推行两税法', category: '政治变革', figure: '杨炎、唐德宗',
        desc: '宰相杨炎推行两税法，以资产为宗、夏秋两征，取代租庸调制。',
        detail: '均田制瓦解、租庸调难行，780年德宗采杨炎之议，不分主客户、按贫富定等，以钱计征、折纳绢帛，分夏秋两次征收。税制由“税人”转向“税地税产”。',
        impact: '中国赋税史的分水岭，此后八百年田赋制度皆沿其脉络。' },
      { id: 'e94', year: 835, period: '唐朝', shortTitle: '甘露之变', title: '甘露之变与宦官专政', category: '政治变革', figure: '唐文宗、李训、郑注、仇士良',
        desc: '文宗与李训、郑注谋诛宦官，事泄反遭屠杀，朝臣几被一空。',
        detail: '文宗不甘受制于宦官，835年李训诈称金吾左仗石榴树夜降甘露，诱宦官仇士良等往观，伏兵欲杀之。仇士良察觉帐后有兵，挟帝入宫，率神策军大杀朝臣，死者千余。',
        impact: '宦官彻底掌控唐廷，“天下事皆决于北司”，唐亡之局定型。' },
      { id: 'e95', year: 875, period: '晚唐', shortTitle: '黄巢起义', title: '黄巢起义与唐室倾覆', category: '军事风云', figure: '黄巢、朱温、李克用',
        desc: '盐贩黄巢起兵转战南北，攻入长安建“大齐”，唐廷名存实亡。',
        detail: '875年黄巢响应王仙芝起事，流动作战跨越十余省，880年攻破洛阳、长安，称帝建大齐。唐廷招沙陀李克用南下，883年收复长安。黄巢部将朱温降唐，成为日后灭唐的主角。',
        impact: '彻底摧毁唐朝统治基础与门阀士族，五代十国的序幕。' },

      // ---------- 五代十国 ----------
      { id: 'e96', year: 923, period: '五代·后唐', shortTitle: '后唐灭梁', title: '李存勖奇袭汴梁灭后梁', category: '军事风云', figure: '李存勖、郭崇韬、朱友贞',
        desc: '李存勖奇袭汴梁，八天灭后梁，建立后唐，五代武功之盛以此为最。',
        detail: '李克用临终授三矢，嘱报刘仁恭、契丹、朱温之仇。李存勖继晋王位后连战皆捷，923年称帝于魏州，国号唐，随即采纳郭崇韬之策直捣汴梁，后梁末帝自杀，梁亡。',
        impact: '沙陀军事集团入主中原，也埋下石敬瑭割让燕云的前因。' },
      { id: 'e97', year: 937, period: '十国·南唐', shortTitle: '南唐立国', title: '李昪代吴建南唐', category: '文明盛世', figure: '李昪、李璟、李煜',
        desc: '李昪代吴建南唐，据江淮富庶之地，成为十国中最强盛者。',
        detail: '杨行密建吴后，权臣徐温、徐知诰父子专权，937年徐知诰受禅称帝，复姓李、改名昪，国号唐，都金陵。南唐保境安民、兴文教，中主李璟、后主李煜皆工词，成为五代文化中心。',
        impact: '五代十国乱世中的文化绿洲，李煜词作成就千古词帝。' },
      { id: 'e98', year: 951, period: '五代·后周', shortTitle: '郭威建周', title: '郭威黄袍加身建后周', category: '政治变革', figure: '郭威、柴荣',
        desc: '后汉枢密使郭威被将士黄袍加身，建后周，开启五代最后的改革。',
        detail: '后汉隐帝诛杀郭威家属，郭威起兵，951年在澶州被拥立，国号周。他革除苛政、废除营田务牛租、提倡节俭，在位三年而卒，养子柴荣继位，进一步整顿军政。',
        impact: '后周改革为北宋统一奠定制度与军事基础，“黄袍加身”剧本再次上演。' },
      { id: 'e99', year: 959, period: '五代·后周', shortTitle: '柴荣北伐', title: '周世宗北伐收复三关', category: '军事风云', figure: '周世宗柴荣、赵匡胤',
        desc: '周世宗北伐辽国，四十余日连收三关三州，病重班师，壮志未酬。',
        detail: '柴荣即位后整顿禁军、均定田赋、毁佛铸钱，南征南唐取十四州。959年亲征辽，收复瀛、莫、易三州及瓦桥、益津、淤口三关，直指幽州时病倒，返汴京后去世，年仅三十九岁。',
        impact: '“五代第一明君”的未竟之业，其部将赵匡胤次年即代周建宋。' },

      // ---------- 北宋 ----------
      { id: 'e100', year: 961, period: '北宋', shortTitle: '杯酒释权', title: '杯酒释兵权与重文抑武', category: '政治变革', figure: '赵匡胤、赵普、石守信',
        desc: '宋太祖“杯酒释兵权”，解除禁军宿将兵权，确立重文抑武的国策。',
        detail: '961年赵匡胤宴请石守信等，以“不如多积金帛田宅以遗子孙”劝其交权，诸将称病请辞。随后设枢密院掌调兵、三衙掌统兵，行更戍法，使“兵无常帅、帅无常师”。',
        impact: '终结了唐末以来武人干政的局面，也造成宋代积弱的军事基因。' },
      { id: 'e101', year: 1069, period: '北宋', shortTitle: '王安石变法', title: '王安石变法与新旧党争', category: '政治变革', figure: '王安石、宋神宗、司马光',
        desc: '神宗任用王安石推行青苗、募役、保甲等新法，引发长达数十年的党争。',
        detail: '王安石以“天变不足畏，祖宗不足法”力主理财整军，设制置三司条例司，推行青苗、免役、方田均税、保甲、将兵诸法。因执行扰民与触犯既得利益，遭到司马光、苏轼等激烈反对，几度罢相。',
        impact: '中国帝制后期最重要的一次系统性改革，其成败争论延续至今。' },
      { id: 'e102', year: 1085, period: '北宋', shortTitle: '元祐更化', title: '元祐更化与党争循环', category: '政治变革', figure: '司马光、高太后、苏轼',
        desc: '神宗死后高太后听政，司马光尽废新法，新旧党争愈演愈烈。',
        detail: '1085年哲宗年幼，高太后垂帘，召司马光为相，数月间废除免役、青苗等法。此后绍圣“绍述”、崇宁“党禁”，新旧两派反复清算，蔡京立“元祐党人碑”。',
        impact: '北宋政治陷入无解的党争循环，行政效率与士大夫共识双双瓦解。' },
      { id: 'e103', year: 1120, period: '北宋', shortTitle: '海上之盟', title: '宋金海上之盟与引狼入室', category: '对外开拓', figure: '宋徽宗、童贯、完颜阿骨打',
        desc: '宋金海上结盟夹击辽国，宋军暴露虚弱，金人随即南下。',
        detail: '宋廷见金势盛，遣马政从登州渡海与金结盟，约定灭辽后燕云归宋、宋输岁币。1122年童贯率军攻燕京大败，最后以巨款从金人手中“赎买”空城。金人由此看清宋朝虚实。',
        impact: '引狼入室的战略失误，靖康之难的直接诱因。' },

      // ---------- 南宋 ----------
      { id: 'e104', year: 1140, period: '南宋', shortTitle: '岳飞北伐', title: '岳飞北伐与郾城大捷', category: '军事风云', figure: '岳飞、韩世忠、秦桧',
        desc: '岳飞率岳家军郾城大捷，进军朱仙镇，直逼开封，被十二道金牌召回。',
        detail: '1140年金兀术毁约南侵，岳飞连复颍昌、陈州、郑州、洛阳，于郾城以步兵破“拐子马”，进军朱仙镇，距开封仅四十五里。高宗、秦桧急召班师，岳飞叹“十年之功，废于一旦”，次年被以“莫须有”罪杀害。',
        impact: '忠奸之辨的民族叙事符号，也标志着南宋主和路线的确立。' },
      { id: 'e105', year: 1141, period: '南宋', shortTitle: '绍兴和议', title: '绍兴和议与南北对峙', category: '政治变革', figure: '宋高宗、秦桧、完颜宗弼',
        desc: '宋金签订绍兴和议，宋向金称臣纳贡，以淮水—大散关为界。',
        detail: '1141年宋廷解除韩世忠、岳飞兵权，与金议和：宋向金称臣、岁贡银绢各二十五万，割唐、邓二州，以淮水中流及大散关为界。次年岳飞被杀，高宗以屈辱换取偏安。',
        impact: '确立宋金南北对峙格局，南宋偏安心态由此定型。' },
      { id: 'e106', year: 1273, period: '南宋', shortTitle: '襄阳之战', title: '襄阳之战与长江门户洞开', category: '军事风云', figure: '吕文焕、刘整、阿术',
        desc: '元军围襄阳六年，以回回炮破城，南宋长江防线门户洞开。',
        detail: '1267年起元军筑堡连营、训练水军长期围困襄阳与樊城，宋军多次救援失败。1273年元军以回回炮（配重投石机）轰城，樊城先破，襄阳守将吕文焕降。此后元军顺汉水入长江，直下临安。',
        impact: '南宋防御体系崩溃，亡国进入最后六年。' },
      { id: 'e107', year: 1279, period: '南宋', shortTitle: '崖山海战', title: '崖山海战与南宋覆亡', category: '军事风云', figure: '陆秀夫、文天祥、张世杰',
        desc: '宋元最后决战于崖山，宋军大败，陆秀夫负幼帝投海，南宋灭亡。',
        detail: '1279年张弘范率元军攻崖山，宋军以铁索连船结寨，被切断淡水与柴薪，士卒疲乏。元军火攻与夹击之下宋军溃败，陆秀夫负八岁帝昺投海，十万军民殉国。',
        impact: '中国历史上第一次全境为北方民族所统治，“崖山之后”成为文化论述的重要节点。' },

      // ---------- 辽 金 西夏 ----------
      { id: 'e108', year: 916, period: '辽朝', shortTitle: '阿保机兴辽', title: '耶律阿保机建国称帝', category: '政治变革', figure: '耶律阿保机、述律平',
        desc: '契丹迭剌部首领耶律阿保机统一诸部称帝，建契丹国，后改国号辽。',
        detail: '阿保机取代遥辇氏为可汗，916年建国称帝，用汉人韩延徽等筑城郭、定法律、创契丹大字。其子耶律德光助石敬瑭得燕云十六州，947年改国号“大辽”。',
        impact: '北方草原帝国的成型，燕云十六州由此成为中原王朝四百年的心病。' },
      { id: 'e109', year: 1115, period: '金朝', shortTitle: '完颜建金', title: '完颜阿骨打起兵建金', category: '政治变革', figure: '完颜阿骨打、完颜宗翰',
        desc: '女真完颜部起兵反辽，阿骨打称帝建金，十年间灭辽。',
        detail: '1114年阿骨打在宁江州以两千七百人起兵，出河店大破辽军。1115年称帝，国号大金。1120年与宋结海上之盟，1125年俘天祚帝，1127年南下灭北宋，形成与南宋对峙之势。',
        impact: '女真崛起改变东亚格局，“猛安谋克”制度兼具军事与行政管理功能。' },
      { id: 'e110', year: 1227, period: '西夏', shortTitle: '西夏亡国', title: '蒙古灭西夏与文明断流', category: '军事风云', figure: '成吉思汗、李睍',
        desc: '蒙古六次征夏，中兴府陷落，西夏灭亡，成吉思汗亦病逝于军中。',
        detail: '1205年起蒙古屡攻西夏，1209年围中兴府迫其纳女称臣。1226年成吉思汗大举进攻，连破黑水城、灵州，1227年夏末帝李睍出降被杀，西夏立国一百九十年而亡。',
        impact: '党项文明遭受毁灭性打击，西夏文逐渐成为死文字。' },
      { id: 'e111', year: 1234, period: '金朝', shortTitle: '蒙古灭金', title: '蒙宋联军灭金于蔡州', category: '军事风云', figure: '窝阔台、拖雷、速不台',
        desc: '蒙古与南宋联军攻破蔡州，金哀宗自缢，金朝灭亡。',
        detail: '1211年起成吉思汗大举攻金，1215年陷中都。1232年三峰山之战拖雷歼灭金军主力，1233年蒙古与宋军合围蔡州，1234年正月城破，哀宗传位完颜承麟后自缢。',
        impact: '百年金朝终结，也为蒙古南下攻宋打开通道。' },

      // ---------- 元 ----------
      { id: 'e112', year: 1280, period: '元朝', shortTitle: '授时历成', title: '郭守敬编成授时历', category: '文明盛世', figure: '郭守敬、王恂、许衡',
        desc: '郭守敬等编成《授时历》，测定回归年长度与今公历几乎一致。',
        detail: '忽必烈命郭守敬改制历法，他创制简仪、高表等仪器，在全国设二十七处观测站。1280年《授时历》颁行，定一年为365.2425日，与格里高利历相同，但早三百年。',
        impact: '中国古代历法的最高成就，行用四百余年。' },
      { id: 'e113', year: 1351, period: '元朝', shortTitle: '红巾起义', title: '红巾起义与元末群雄', category: '军事风云', figure: '韩山童、刘福通、朱元璋',
        desc: '白莲教首领韩山童、刘福通以“石人一只眼”为号起兵，红巾军席卷南北。',
        detail: '元末黄河泛滥、滥发纸钞，1351年治河民夫被煽动起事，头裹红巾。刘福通立韩林儿为小明王，徐寿辉、郭子兴等响应。朱元璋原为郭子兴部将，逐步崛起。',
        impact: '元朝统治的掘墓人，朱元璋借此完成从乞丐到皇帝的逆袭。' },

      // ---------- 明 ----------
      { id: 'e114', year: 1399, period: '明朝', shortTitle: '靖难之役', title: '靖难之役与永乐夺位', category: '军事风云', figure: '朱棣、朱允炆、姚广孝',
        desc: '燕王朱棣以“清君侧”起兵，四年攻入南京，建文帝下落不明。',
        detail: '建文帝削藩，朱棣在北平起兵，得宁王朵颜三卫骑兵，采姚广孝之策直取京师。1402年渡江入南京，宫中大火，建文帝失踪。朱棣即位，废建文年号，大杀方孝孺等建文旧臣。',
        impact: '明朝政治重心北移，也留下“建文帝下落”六百年的历史谜案。' },
      { id: 'e115', year: 1421, period: '明朝', shortTitle: '永乐迁都', title: '永乐迁都与北京营建', category: '政治变革', figure: '明成祖朱棣、蒯祥',
        desc: '朱棣营建北京城并迁都，确立此后五百余年的首都格局。',
        detail: '1406年起征调百万民夫营建北京宫城、皇城与外城，以南京宫殿为蓝本，1420年建成，1421年正式迁都。同时疏浚大运河，使江南漕粮直达北京。',
        impact: '北京作为全国首都的起点，“天子守国门”格局确立。' },
      { id: 'e116', year: 1449, period: '明朝', shortTitle: '土木之变', title: '土木之变与北京保卫战', category: '军事风云', figure: '王振、明英宗、于谦',
        desc: '英宗听信王振亲征瓦剌，土木堡全军覆没，皇帝被俘。',
        detail: '瓦剌也先分道南侵，王振怂恿英宗仓促亲征，二十万大军出居庸关，因辎重落后、路线反复，在土木堡被围，水源断绝。明军溃败，英宗被俘。于谦随即拥立景泰帝、组织北京保卫战。',
        impact: '明朝由盛转衰的转折点，武备废弛、文官政治全面确立。' },
      { id: 'e117', year: 1561, period: '明朝', shortTitle: '抗倭平患', title: '戚继光台州九战九捷', category: '军事风云', figure: '戚继光、俞大猷、胡宗宪',
        desc: '戚继光练“戚家军”，台州九战九捷，东南倭患基本平定。',
        detail: '嘉靖年间倭寇与海盗勾结，东南沿海糜烂。戚继光在义乌募兵，创鸳鸯阵，1561年台州之战连战皆捷，斩倭数千；又与俞大猷转战福建、广东，至1566年倭患大致平息。',
        impact: '明代海防体系的最后辉煌，也暴露出海禁政策的结构性困境。' },
      { id: 'e118', year: 1619, period: '明朝', shortTitle: '萨尔浒战', title: '萨尔浒之战与辽东逆转', category: '军事风云', figure: '努尔哈赤、杨镐、杜松',
        desc: '后金以“凭尔几路来，我只一路去”大败明军四路进攻，辽东局势逆转。',
        detail: '1619年明廷集十一万大军分四路围攻赫图阿拉，努尔哈赤集中八旗兵力各个击破，五日之内三路覆没，杜松战死。此后后金由防御转入进攻，连陷沈阳、辽阳。',
        impact: '明清易代的第一场战略决战，明朝在辽东彻底转为守势。' },

      // ---------- 清 ----------
      { id: 'e119', year: 1681, period: '清朝', shortTitle: '平定三藩', title: '康熙平定三藩之乱', category: '军事风云', figure: '康熙帝、吴三桂、图海',
        desc: '康熙帝果断撤藩，历时八年平定吴三桂等三藩之乱，中央集权巩固。',
        detail: '1673年吴三桂杀云南巡抚起兵，耿精忠、尚之信响应，一度据有半壁。康熙坚决不撤兵、分化招抚，1681年清军攻入昆明，吴世璠自杀，三藩平定。',
        impact: '清朝真正完成对南方的控制，为统一台湾、经营边疆扫清障碍。' },
      { id: 'e120', year: 1689, period: '清朝', shortTitle: '尼布楚约', title: '中俄尼布楚条约划界', category: '对外开拓', figure: '索额图、佟国纲、戈洛文',
        desc: '中俄签订《尼布楚条约》，划定东段边界，确立黑龙江流域归属。',
        detail: '雅克萨之战后，清廷与俄国在尼布楚谈判，以拉丁文为正式文本，约定以格尔必齐河、额尔古纳河及外兴安岭为界，尼布楚归俄，雅克萨拆除。这是中国与西方国家签订的第一个平等条约。',
        impact: '奠定东北边疆的法理基础，也开启清朝的条约外交实践。' },
      { id: 'e121', year: 1759, period: '清朝', shortTitle: '平定准部', title: '平定准噶尔与大小和卓', category: '军事风云', figure: '乾隆帝、兆惠、阿睦尔撒纳',
        desc: '清军历经五年平定准噶尔与大小和卓，新疆全境纳入版图。',
        detail: '1755年清军趁准噶尔内乱出兵伊犁，阿睦尔撒纳旋即反叛，清军二次进剿至1759年平定。同年兆惠、富德又平定大小和卓之乱，设伊犁将军统辖天山南北。',
        impact: '奠定近代中国西北版图，新疆正式纳入中央直接治理体系。' },
      { id: 'e122', year: 1782, period: '清朝', shortTitle: '四库全书', title: '四库全书与寓禁于征', category: '文明盛世', figure: '纪昀、乾隆帝、戴震',
        desc: '乾隆敕修《四库全书》，收书三千四百余种，为古代最大丛书。',
        detail: '1773年开四库全书馆，纪昀任总纂，历时十年成书七万九千余卷，抄写七部藏于南北七阁。同时寓禁于征，全毁、抽毁书籍数千种，大批文献因此失传。',
        impact: '古代文献整理的集大成，也是清代文字狱与文化专制的双重见证。' },
      { id: 'e123', year: 1894, period: '晚清', shortTitle: '甲午战败', title: '甲午战争与马关条约', category: '军事风云', figure: '李鸿章、邓世昌、伊藤博文',
        desc: '中日甲午战争北洋水师覆没，次年签订《马关条约》割台赔款。',
        detail: '1894年丰岛海战爆发，黄海海战中邓世昌率致远舰冲锋殉国，1895年威海卫陷落，北洋水师全军覆没。4月签订《马关条约》，割让台湾、澎湖，赔款二亿两。',
        impact: '洋务运动破产，民族危机空前，直接引发戊戌变法与革命思潮。' },
      { id: 'e124', year: 1898, period: '晚清', shortTitle: '戊戌变法', title: '百日维新与戊戌政变', category: '政治变革', figure: '康有为、梁启超、光绪帝、谭嗣同',
        desc: '光绪帝采纳康梁主张推行百日维新，遭慈禧政变镇压，六君子遇害。',
        detail: '1898年6月光绪帝下“明定国是”诏，百余日内颁布新政数十道，涉及科举、学堂、练兵、工商。9月慈禧发动政变，囚光绪于瀛台，康梁逃亡，谭嗣同等六人被杀。',
        impact: '体制内改良路径的终结，此后革命成为主流。' }
    ];

    // 合并、排序（按年份，同年按编号），并按六字规则校验标题长度
    HISTORICAL_EVENTS.push(...EXTRA_EVENTS);
    HISTORICAL_EVENTS.sort((a, b) => (a.year - b.year) || a.id.localeCompare(b.id));

          { n: '文宗 奕詝', r: '1850—1861', y: 1850, d: '太平天国与英法联军并起，圆明园被焚，崩于热河。' },
          { n: '穆宗 载淳', r: '1861—1874', y: 1861, d: '同治中兴与洋务运动，实权在慈禧，亲政次年病逝。' },
          { n: '德宗 载湉', r: '1874—1908', y: 1874, d: '甲午战败后支持戊戌变法，被慈禧囚于瀛台，庚子后推行新政。' },
          { n: '宣统 溥仪', r: '1908—1912', y: 1908, d: '三岁登基，辛亥革命后退位，帝制终结。' }
        ] }],
        figures: [
          { n: '多尔衮', r: '摄政王', d: '率清军入关，定都北京，推行剃发易服，权倾一时。' },
          { n: '纳兰性德', r: '词人', d: '清词第一，“人生若只如初见”，凄婉哀感。' },
          { n: '纪昀', r: '四库总纂', d: '主持《四库全书》，著《阅微草堂笔记》。' },
          { n: '和珅', r: '军机大臣', d: '乾隆宠臣，聚敛巨富，嘉庆即位后赐死抄家。' },
          { n: '林则徐', r: '钦差大臣', d: '虎门销烟，编《四洲志》，“开眼看世界第一人”。' },
          { n: '曾国藩', r: '两江总督', d: '练湘军平太平天国，倡洋务，家书影响深远。' },
          { n: '李鸿章', r: '直隶总督', d: '办北洋水师与洋务企业，代表清廷签订一系列条约。' },
          { n: '左宗棠', r: '陕甘总督', d: '抬棺西征收复新疆，办福州船政局。' },
          { n: '慈禧太后', r: '实际执政者', d: '垂帘听政四十七年，支持洋务、镇压变法、推行新政。' },
          { n: '康有为', r: '维新领袖', d: '公车上书、戊戌变法，著《大同书》倡改制。' }
        ]
      }
    ];

    // 档案索引：id -> 档案
    const ARCHIVE_MAP = {};
    DYNASTY_ARCHIVES.forEach((a) => { ARCHIVE_MAP[a.id] = a; });
    /********************************************************************
     * 4. 连续无级比例尺引擎 (20% ~ 220%，80% 为事件展开/折叠阈值)
     ********************************************************************/
    const TIME_SEGMENTS = [
      { start: -2100, end: -770, basePxPerYear: 0.44 }, // 夏商西周
      { start: -770,  end: -221, basePxPerYear: 1.40 }, // 春秋战国
      { start: -221,  end: 220,  basePxPerYear: 1.90 }, // 秦汉
      { start: 220,   end: 589,  basePxPerYear: 3.70 }, // 三国、两晋十六国、南北朝
      { start: 589,   end: 907,  basePxPerYear: 2.35 }, // 隋唐
      { start: 907,   end: 979,  basePxPerYear: 5.60 }, // 五代十国
      { start: 979,   end: 1368, basePxPerYear: 2.45 }, // 宋辽夏金元
      { start: 1368,  end: 1920, basePxPerYear: 2.40 }  // 明清至民初
    ];

    const BASE_LEFT_PADDING = 220;
    const BASE_RIGHT_PADDING = 240;

    const MIN_SCALE = 0.20;  // 最低可缩放到 20%，一屏统筹中华上下五千年全貌
    const MAX_SCALE = 2.20;  // 最高可放大到 220%，精细查看密集政权与事件
    const EVENT_UNFOLD_THRESHOLD = 0.80; // 80% 阈值：>=80% 呈现事件，<80% 柔和折叠

    /********************************************************************
     * 5. DOM 引用
     ********************************************************************/
    const viewportEl = document.getElementById('timeline-viewport');
    const canvasEl = document.getElementById('timeline-canvas');
    const ticksLayer = document.getElementById('ticks-layer');
    const macroLayer = document.getElementById('macro-dynasty-layer');
    const subLayer = document.getElementById('sub-regime-layer');
    const eventsLayer = document.getElementById('events-layer');
    const axisLineEl = document.getElementById('events-axis-line');
    const quickNavEl = document.getElementById('dynasty-quick-nav');
    const centerEraBadge = document.getElementById('center-era-badge');
    const centerYearDisplay = document.getElementById('center-year-display');
    const zoomLabelEl = document.getElementById('zoom-label');
    const eventStatusPill = document.getElementById('event-status-pill');

    const domCache = { ticks: [], macros: [], subs: [], events: [] };

    const state = {
      zoomScale: 1.00,
      scrollX: 0,
      showEventsMaster: true,
      activeCategory: 'all',
      selectedEventId: 'e15',
      activeDynastyId: 'sanguo',
      activeSubId: 'caowei',
      isDragging: false,
      hasMoved: false,
      dragStartX: 0,
      dragStartScrollX: 0,
      velocityX: 0,
      lastMoveTime: 0,
      lastMoveX: 0,
      rafId: null,
      zoomAnimId: null,
      suppressClickUntil: 0
    };

    /* 画卷纵向几何：由视口高度推导，保证 iPad 竖屏/横屏都填满，不留空洞 */
    const GEOM = {
      v: 1,
      macroTop: 26,
      macroH: 52,
      subH: 34,
      subTops: [84, 122, 160],
      axisY: 204,
      slipW: 28,
      stems: [8, 24],
      offsetY: 0
    };

    function recomputeGeometry() {
      const bandH = Math.max(180, viewportEl.clientHeight || 300);
      // 设计基准：轴线 204 + 竹简区块约 118 = 322，按比例铺满整条画卷带
      const v = Math.min(1.45, Math.max(0.60, (bandH - 8) / 348));
      GEOM.v = v;

      const px = (n) => Math.round(n * v);
      GEOM.macroTop = px(26);
      GEOM.macroH = Math.max(px(52), 36);
      GEOM.subH = Math.max(px(34), 24);
      GEOM.subTops = [0, 1, 2].map((i) => px(84 + i * 38));
      GEOM.axisY = px(204);
      GEOM.slipW = Math.max(20, px(24));
      GEOM.stems = [px(8), px(22), px(36), px(50)];

      const contentH = GEOM.axisY + px(139);
      GEOM.offsetY = Math.max(0, Math.round((bandH - contentH) / 2));

      canvasEl.style.setProperty('--v', v.toFixed(3));
      canvasEl.style.setProperty('--macro-top', GEOM.macroTop + 'px');
      canvasEl.style.setProperty('--macro-h', GEOM.macroH + 'px');
      canvasEl.style.setProperty('--sub-h', GEOM.subH + 'px');
      canvasEl.style.setProperty('--slip-w', GEOM.slipW + 'px');
      canvasEl.style.setProperty('--axis-y', GEOM.axisY + 'px');
      axisLineEl.style.top = GEOM.axisY + 'px';
    }

    /********************************************************************
     * 6. 年份 <-> 画布坐标
     ********************************************************************/
    function getLeftPadding(customScale = state.zoomScale) {
      return Math.max(48, Math.round(BASE_LEFT_PADDING * Math.min(1, customScale + 0.15)));
    }

    function getRightPadding(customScale = state.zoomScale) {
      return Math.max(48, Math.round(BASE_RIGHT_PADDING * Math.min(1, customScale + 0.15)));
    }

    function yearToX(year, customScale = state.zoomScale) {
      let x = getLeftPadding(customScale);
      for (const seg of TIME_SEGMENTS) {
        if (year <= seg.start) break;
        const span = Math.min(year, seg.end) - seg.start;
        if (span > 0) x += span * seg.basePxPerYear * customScale;
      }
      return x;
    }

    function xToYear(x, customScale = state.zoomScale) {
      let rem = x - getLeftPadding(customScale);
      if (rem <= 0) return TIME_SEGMENTS[0].start;
      for (const seg of TIME_SEGMENTS) {
        const segWidth = (seg.end - seg.start) * seg.basePxPerYear * customScale;
        if (rem <= segWidth) {
          return Math.round(seg.start + rem / (seg.basePxPerYear * customScale));
        }
        rem -= segWidth;
      }
      return TIME_SEGMENTS[TIME_SEGMENTS.length - 1].end;
    }

    function getTotalCanvasWidth(customScale = state.zoomScale) {
      return yearToX(1920, customScale) + getRightPadding(customScale);
    }

    function formatYearStr(year) {
      return year < 0 ? `前${Math.abs(year)}年` : `公元${year}年`;
    }

    function isTapSuppressed() {
      return performance.now() < state.suppressClickUntil;
    }

    /********************************************************************
     * 7. 顶部朝代快速检索
     ********************************************************************/
    function renderQuickNav() {
      quickNavEl.innerHTML = '';
      MACRO_DYNASTIES.forEach((dyn) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.dynId = dyn.id;
        btn.className = 'dyn-nav-pill' + (dyn.id === state.activeDynastyId ? ' active' : '');
        btn.textContent = dyn.name.replace('(春秋战国)', '');
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeDynastyId = dyn.id;
          state.activeSubId = null;
          state.selectedEventId = null;
          const midYear = Math.round((dyn.start + dyn.end) / 2);
          centerOnYear(midYear, true);
          showDynastyDetail(dyn, '大朝代总览');
          updateActiveHighlights();
          scrollActiveNavIntoView(dyn.id);
        });
        quickNavEl.appendChild(btn);
      });
    }

    function scrollActiveNavIntoView(dynId) {
      const targetBtn = quickNavEl.querySelector(`[data-dyn-id="${dynId}"]`);
      if (!targetBtn) return;
      const navRect = quickNavEl.getBoundingClientRect();
      const btnRect = targetBtn.getBoundingClientRect();
      const offset = (btnRect.left - navRect.left) - (navRect.width / 2) + (btnRect.width / 2);
      quickNavEl.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function initNavScroll() {
      // 鼠标端拖拽（触屏端交给浏览器原生 pan-x）
      let drag = null;
      quickNavEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        drag = { startX: e.clientX, left: quickNavEl.scrollLeft, moved: false };
      });
      window.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.startX;
        if (Math.abs(dx) > 3) drag.moved = true;
        if (drag.moved) {
          e.preventDefault();
          quickNavEl.scrollLeft = drag.left - dx;
        }
      }, { passive: false });
      window.addEventListener('pointerup', () => { drag = null; });

      document.getElementById('nav-scroll-left').addEventListener('click', () => {
        quickNavEl.scrollBy({ left: -Math.round(quickNavEl.clientWidth * 0.7), behavior: 'smooth' });
      });
      document.getElementById('nav-scroll-right').addEventListener('click', () => {
        quickNavEl.scrollBy({ left: Math.round(quickNavEl.clientWidth * 0.7), behavior: 'smooth' });
      });
    }

    /********************************************************************
     * 8. 画布节点构建
     ********************************************************************/
    const TICK_YEARS = [
      -2070, -1600, -1300, -1046, -770, -500, -350, -221, -100, 1, 100,
      220, 280, 317, 383, 420, 494, 534, 589, 618, 700, 755, 820, 907,
      960, 1038, 1127, 1206, 1271, 1368, 1450, 1550, 1644, 1735, 1840, 1912
    ];

    function buildCanvasElementsOnce() {
      // 1. 刻度线
      ticksLayer.innerHTML = '';
      domCache.ticks = TICK_YEARS.map((yr) => {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.innerHTML = `<span class="tick-label">${yr < 0 ? '前' + Math.abs(yr) : yr}</span><span class="tick-mark"></span>`;
        ticksLayer.appendChild(tick);
        return { yr, el: tick };
      });

      // 2. 大朝代块
      macroLayer.innerHTML = '';
      domCache.macros = MACRO_DYNASTIES.map((dyn) => {
        const block = document.createElement('div');
        block.dataset.dynId = dyn.id;
        block.className = 'macro-dynasty-block';
        block.style.backgroundColor = dyn.bg;
        block.style.borderColor = dyn.color;

        const nameEl = document.createElement('div');
        nameEl.className = 'macro-name';
        nameEl.style.color = dyn.color;
        nameEl.textContent = dyn.name;

        const periodEl = document.createElement('div');
        periodEl.className = 'macro-period';
        periodEl.style.backgroundColor = dyn.color;
        periodEl.textContent = dyn.period;

        block.appendChild(nameEl);
        block.appendChild(periodEl);

        block.addEventListener('click', (e) => {
          if (isTapSuppressed()) return;
          e.stopPropagation();
          state.activeDynastyId = dyn.id;
          state.activeSubId = null;
          state.selectedEventId = null;
          showDynastyDetail(dyn, '朝代总览');
          updateActiveHighlights();
          scrollActiveNavIntoView(dyn.id);
        });

        macroLayer.appendChild(block);
        return { dyn, el: block, nameEl, periodEl };
      });

      // 3. 细分政权块
      subLayer.innerHTML = '';
      const sortedSubs = [...SUB_REGIMES].sort((a, b) => a.start - b.start);
      domCache.subs = sortedSubs.map((sub) => {
        const el = document.createElement('div');
        el.dataset.subId = sub.id;
        el.className = 'sub-regime-block stacked';
        el.style.backgroundColor = sub.color;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'sub-name';
        nameSpan.textContent = sub.name;

        const periodSpan = document.createElement('span');
        periodSpan.className = 'sub-period';
        periodSpan.textContent = sub.period;

        el.appendChild(nameSpan);
        el.appendChild(periodSpan);

        el.addEventListener('click', (e) => {
          if (isTapSuppressed()) return;
          e.stopPropagation();
          state.activeSubId = sub.id;
          state.selectedEventId = null;
          showDynastyDetail(sub, '细分政权 / 并立国家');
          updateActiveHighlights();
        });

        subLayer.appendChild(el);
        return { sub, el, nameSpan, periodSpan };
      });

      // 4. 重大历史事件竹简
      buildHistoricalEventElements();
    }

    const CATEGORY_COLORS = {
      '政治变革': '#B8332A',
      '军事风云': '#2F4F6F',
      '文明盛世': '#9E6224',
      '对外开拓': '#2E6E5E'
    };

    function buildHistoricalEventElements() {
      eventsLayer.innerHTML = '';

      const filtered = HISTORICAL_EVENTS.filter((ev) =>
        state.activeCategory === 'all' || ev.category === state.activeCategory
      );

      domCache.events = filtered.map((ev) => {
        const dotColor = CATEGORY_COLORS[ev.category] || '#B8332A';
        const isSelected = state.selectedEventId === ev.id;
        const shortYear = ev.year < 0 ? `前${Math.abs(ev.year)}` : `${ev.year}`;

        const node = document.createElement('div');
        node.dataset.eventId = ev.id;
        node.className = 'event-node' + (isSelected ? ' selected' : '');
        node.innerHTML = `
          <div class="event-stack">
            <div class="pulse-circle" style="background-color:${dotColor};"></div>
            <div class="slip-fold-wrapper">
              <div class="stem-line" style="background-color:${dotColor};"></div>
              <div class="vertical-bamboo-slip">
                <span class="slip-year" style="background-color:${dotColor}1f;color:${dotColor};">${shortYear}</span>
                <span class="slip-title">${ev.shortTitle}</span>
              </div>
            </div>
          </div>
        `;

        const stemEl = node.querySelector('.stem-line');

        node.addEventListener('click', (e) => {
          if (isTapSuppressed()) return;
          e.stopPropagation();
          // 处于 <80% 折叠态时，点击圆点自动放大到 100% 并展开详情
          if (state.zoomScale < EVENT_UNFOLD_THRESHOLD) {
            animateZoomTo(1.00, ev.year);
          }
          selectHistoricalEvent(ev.id, true);
        });

        eventsLayer.appendChild(node);
        return { ev, el: node, stemEl };
      });
    }

    /********************************************************************
     * 9. 布局刷新（随 zoomScale 与画布高度实时重排）
     ********************************************************************/
    function updateCanvasLayout() {
      const v = GEOM.v;
      const totalW = getTotalCanvasWidth();
      canvasEl.style.width = `${totalW}px`;

      const pct = Math.round(state.zoomScale * 100);
      zoomLabelEl.textContent = `${pct}%`;
      zoomLabelEl.classList.toggle('zoom-active', state.zoomScale >= EVENT_UNFOLD_THRESHOLD);

      // 1) 刻度
      const minTickGap = 34 * v;
      let lastTickX = -9999;
      domCache.ticks.forEach(({ yr, el }) => {
        const x = yearToX(yr);
        el.style.left = `${x}px`;
        if (x - lastTickX < minTickGap) {
          el.style.opacity = '0';
        } else {
          el.style.opacity = '1';
          lastTickX = x;
        }
      });

      // 2) 大朝代块：宽度不足时自动降级为简称
      let prevMacroRight = -9999;
      domCache.macros.forEach(({ dyn, el, nameEl, periodEl }) => {
        let x1 = yearToX(dyn.start);
        const x2 = yearToX(dyn.end);
        if (x1 < prevMacroRight + 1.5) x1 = prevMacroRight + 1.5;
        const minW = Math.max(14, Math.round(46 * state.zoomScale * v));
        const width = Math.max(x2 - x1 - 1.5, minW);
        prevMacroRight = x1 + width;

        el.style.left = `${x1}px`;
        el.style.width = `${width}px`;

        const w = width / v; // 折算回设计宽度
        if (w < 36) {
          nameEl.textContent = dyn.shortName || dyn.name;
          nameEl.style.fontSize = `${Math.round(11 * v)}px`;
          periodEl.style.display = 'none';
        } else if (w < 64) {
          nameEl.textContent = dyn.shortName || dyn.name;
          nameEl.style.fontSize = `${Math.round(13 * v)}px`;
          periodEl.style.display = 'none';
        } else if (w < 96) {
          nameEl.textContent = dyn.name;
          nameEl.style.fontSize = `${Math.round(14 * v)}px`;
          periodEl.style.display = 'block';
        } else {
          nameEl.textContent = dyn.name;
          nameEl.style.fontSize = `${Math.round(16 * v)}px`;
          periodEl.style.display = 'block';
        }
      });

      // 3) 三轨细分政权
      const trackLastRight = [-9999, -9999, -9999];
      domCache.subs.forEach(({ sub, el, nameSpan, periodSpan }) => {
        const t = sub.track || 0;
        let x1 = yearToX(sub.start);
        const x2 = yearToX(sub.end);
        if (x1 < trackLastRight[t] + 1.5) x1 = trackLastRight[t] + 1.5;
        const minSubW = Math.max(12, Math.round(48 * state.zoomScale * v));
        const width = Math.max(x2 - x1 - 1.5, minSubW);
        trackLastRight[t] = x1 + width;

        el.style.left = `${x1}px`;
        el.style.top = `${GEOM.subTops[t]}px`;
        el.style.width = `${width}px`;

        const w = width / v;
        if (w < 32) {
          el.classList.add('stacked');
          nameSpan.textContent = sub.shortName || sub.name.slice(0, 2);
          nameSpan.style.fontSize = `${Math.round(10 * v)}px`;
          periodSpan.style.display = 'none';
        } else if (w < 60) {
          el.classList.add('stacked');
          nameSpan.textContent = sub.shortName || sub.name;
          nameSpan.style.fontSize = `${Math.round(11 * v)}px`;
          periodSpan.style.display = 'none';
        } else if (w < 112) {
          el.classList.add('stacked');
          nameSpan.textContent = sub.name;
          nameSpan.style.fontSize = `${Math.round(12 * v)}px`;
          periodSpan.style.display = 'inline';
          periodSpan.className = 'sub-period';
          periodSpan.style.fontSize = `${Math.round(9 * v)}px`;
        } else {
          el.classList.remove('stacked');
          nameSpan.textContent = sub.name;
          nameSpan.style.fontSize = `${Math.round(13 * v)}px`;
          periodSpan.style.display = 'inline';
          periodSpan.className = 'sub-period inline-badge';
          periodSpan.style.fontSize = `${Math.round(10 * v)}px`;
        }
      });

      // 4) 重大历史事件：双行错位 + 80% 阈值折叠
      const isFoldedByZoom = state.zoomScale < EVENT_UNFOLD_THRESHOLD;
      const slipW = GEOM.slipW;
      const rowLastRight = [-9999, -9999, -9999, -9999];
      const nodeTop = GEOM.axisY - Math.round(6 * v);

      domCache.events.forEach(({ ev, el, stemEl }) => {
        const x = yearToX(ev.year);
        const halfW = slipW / 2 + 1;

        let chosenRow = rowLastRight.findIndex((last) => x - halfW >= last + 4);
        if (chosenRow === -1) chosenRow = rowLastRight.length - 1;
        rowLastRight[chosenRow] = x + halfW;

        el.style.left = `${x}px`;
        el.style.top = `${nodeTop}px`;
        stemEl.style.height = `${GEOM.stems[chosenRow]}px`;

        el.classList.toggle('hidden-by-switch', !state.showEventsMaster);
        el.classList.toggle('folded-by-zoom', state.showEventsMaster && isFoldedByZoom);
      });

      updateEventStatusBadge();
      updateActiveHighlights();
    }

    function updateEventStatusBadge() {
      const isFoldedByZoom = state.zoomScale < EVENT_UNFOLD_THRESHOLD;
      if (!state.showEventsMaster) {
        eventStatusPill.textContent = '已关闭';
        eventStatusPill.dataset.state = 'off';
      } else if (isFoldedByZoom) {
        eventStatusPill.textContent = '已折叠 (<80%)';
        eventStatusPill.dataset.state = 'folded';
      } else {
        eventStatusPill.textContent = `展开 (${domCache.events.length})`;
        eventStatusPill.dataset.state = 'open';
      }
    }

    /********************************************************************
     * 10. 详情卡片联动
     ********************************************************************/
    function selectHistoricalEvent(eventId, centerView = false) {
      const ev = HISTORICAL_EVENTS.find((item) => item.id === eventId);
      if (!ev) return;

      state.selectedEventId = ev.id;
      state.activeSubId = null;

      const matchedDyn = MACRO_DYNASTIES.find((d) => ev.year >= d.start && ev.year <= d.end);
      if (matchedDyn) {
        state.activeDynastyId = matchedDyn.id;
        scrollActiveNavIntoView(matchedDyn.id);

    function updateActiveHighlights() {

    /********************************************************************
     * 11. 滚动与缩放
     ********************************************************************/
    function clampScrollX(x) {
      const vw = viewportEl.clientWidth;
      const maxScroll = Math.max(0, getTotalCanvasWidth() - vw);
      return Math.max(0, Math.min(x, maxScroll));
    }

    function applyScrollTransform() {
      state.scrollX = clampScrollX(state.scrollX);
      canvasEl.style.transform = `translate3d(${-state.scrollX}px, ${GEOM.offsetY}px, 0)`;

      const centerX = state.scrollX + viewportEl.clientWidth / 2;
      const curYear = xToYear(centerX);
      centerYearDisplay.textContent = formatYearStr(curYear);

      const curDyn = MACRO_DYNASTIES.find((d) => curYear >= d.start && curYear <= d.end);
      if (curDyn) centerEraBadge.textContent = curDyn.name.replace('(春秋战国)', '');
    }

    function setZoomScaleAnchored(newScale, anchorViewportX = viewportEl.clientWidth / 2) {
      const clampedScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      if (Math.abs(clampedScale - state.zoomScale) < 0.0005) return;

      const anchorCanvasXBefore = state.scrollX + anchorViewportX;
      const anchorYear = xToYear(anchorCanvasXBefore, state.zoomScale);

      state.zoomScale = clampedScale;
      updateCanvasLayout();

      const anchorCanvasXAfter = yearToX(anchorYear, state.zoomScale);
      state.scrollX = clampScrollX(anchorCanvasXAfter - anchorViewportX);
      applyScrollTransform();
    }

    function animateZoomTo(targetScale, focusYear = null, anchorViewportX = null) {
      if (state.zoomAnimId) cancelAnimationFrame(state.zoomAnimId);

      const startScale = state.zoomScale;
      const target = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
      if (Math.abs(target - startScale) < 0.002) return;

      const anchorX = anchorViewportX === null ? viewportEl.clientWidth / 2 : anchorViewportX;
      const anchorYear = focusYear !== null ? focusYear : xToYear(state.scrollX + anchorX, startScale);
      const startTime = performance.now();
      const duration = 380;

      const step = (now) => {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        state.zoomScale = startScale + (target - startScale) * ease;
        updateCanvasLayout();
        state.scrollX = clampScrollX(yearToX(anchorYear, state.zoomScale) - anchorX);
        applyScrollTransform();
        if (t < 1) {
          state.zoomAnimId = requestAnimationFrame(step);
        } else {
          state.zoomAnimId = null;
          syncNavAfterScroll();
        }
      };
      state.zoomAnimId = requestAnimationFrame(step);
    }

    function centerOnYear(year, smooth = true) {
      if (state.rafId) cancelAnimationFrame(state.rafId);
      const targetX = clampScrollX(yearToX(year) - viewportEl.clientWidth / 2);
      if (!smooth) {
        state.scrollX = targetX;
        applyScrollTransform();
        return;
      }
      const startX = state.scrollX;
      const diff = targetX - startX;
      const startTime = performance.now();
      const duration = 380;

      const step = (now) => {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        state.scrollX = startX + diff * ease;
        applyScrollTransform();
        if (t < 1) {
          state.rafId = requestAnimationFrame(step);
        } else {
          state.rafId = null;
          syncNavAfterScroll();
        }
      };
      state.rafId = requestAnimationFrame(step);
    }

    function syncNavAfterScroll() {
      const centerX = state.scrollX + viewportEl.clientWidth / 2;
      const curYear = xToYear(centerX);
      const curDyn = MACRO_DYNASTIES.find((d) => curYear >= d.start && curYear <= d.end);
      if (curDyn && curDyn.id !== state.activeDynastyId) {
        state.activeDynastyId = curDyn.id;
        updateActiveHighlights();
        scrollActiveNavIntoView(curDyn.id);
      }
    }

    function stopAnimations() {
      if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
      if (state.zoomAnimId) { cancelAnimationFrame(state.zoomAnimId); state.zoomAnimId = null; }
    }

    /********************************************************************
     * 12. 单指惯性滑动 + 双指捏合 + 双击放大（iPad 触屏优化）
     ********************************************************************/
    function initTimelineGestures() {
      const pointers = new Map();
      let pinching = false;
      let pinchStartDist = 0;
      let pinchStartScale = 1;
      let lastTapTime = 0;
      let lastTapX = 0;

      function pinchInfo() {
        const pts = Array.from(pointers.values());
        const dx = pts[0].x - pts[1].x;
        const dy = pts[0].y - pts[1].y;
        const rect = viewportEl.getBoundingClientRect();
        return {
          dist: Math.hypot(dx, dy),
          centerX: (pts[0].x + pts[1].x) / 2 - rect.left
        };
      }

      function startInertia() {
        let v = -state.velocityX * 16;
        if (Math.abs(v) <= 1.2) { syncNavAfterScroll(); return; }
        const stepInertia = () => {
          v *= 0.92;
          const before = state.scrollX;
          state.scrollX += v;
          applyScrollTransform();
          if (Math.abs(v) > 0.5 && Math.abs(state.scrollX - before) > 0.1) {
            state.rafId = requestAnimationFrame(stepInertia);
          } else {
            state.rafId = null;
            syncNavAfterScroll();
          }
        };
        state.rafId = requestAnimationFrame(stepInertia);
      }

      viewportEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        stopAnimations();
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2) {
          pinching = true;
          state.isDragging = false;
          state.hasMoved = true;
          const { dist } = pinchInfo();
          pinchStartDist = Math.max(dist, 20);
          pinchStartScale = state.zoomScale;
        } else if (pointers.size === 1) {
          pinching = false;
          state.isDragging = true;
          state.hasMoved = false;
          state.dragStartX = e.clientX;
          state.dragStartScrollX = state.scrollX;
          state.velocityX = 0;
          state.lastMoveX = e.clientX;
          state.lastMoveTime = performance.now();
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2 && pinching) {
          const { dist, centerX } = pinchInfo();
          setZoomScaleAnchored(pinchStartScale * (dist / pinchStartDist), centerX);
          return;
        }

        if (state.isDragging && pointers.size === 1) {
          const dx = e.clientX - state.dragStartX;
          if (Math.abs(dx) > 6) state.hasMoved = true;
          if (!state.hasMoved) return;

          state.scrollX = state.dragStartScrollX - dx;
          applyScrollTransform();

          const now = performance.now();
          const dt = now - state.lastMoveTime;
          if (dt > 0) {
            state.velocityX = (e.clientX - state.lastMoveX) / dt;
            state.lastMoveX = e.clientX;
            state.lastMoveTime = now;
          }
        }
      }, { passive: true });

      function onPointerEnd(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);

        // 捏合结束
        if (pinching && pointers.size < 2) {
          pinching = false;
          state.isDragging = false;
          state.suppressClickUntil = performance.now() + 320;
          if (pointers.size === 1) {
            const remaining = Array.from(pointers.values())[0];
            state.isDragging = true;
            state.hasMoved = true;
            state.dragStartX = remaining.x;
            state.dragStartScrollX = state.scrollX;
            state.velocityX = 0;
            state.lastMoveX = remaining.x;
            state.lastMoveTime = performance.now();
          } else {
            syncNavAfterScroll();
          }
          return;
        }

        if (state.isDragging && pointers.size === 0) {
          state.isDragging = false;

          if (state.hasMoved) {
            // 拖动结束后的这次 click 必须吞掉，否则会误选中竹简
            state.suppressClickUntil = performance.now() + 320;
            startInertia();
            return;
          }

          // 轻点：判断是否为双击放大
          const now = performance.now();
          const rect = viewportEl.getBoundingClientRect();
          const tapX = e.clientX - rect.left;
          const onNode = e.target.closest && e.target.closest('.event-node, .macro-dynasty-block, .sub-regime-block');

          if (!onNode && now - lastTapTime < 330 && Math.abs(tapX - lastTapX) < 60) {
            const next = state.zoomScale > 1.15 ? 1.00 : Math.min(MAX_SCALE, state.zoomScale * 1.55);
            animateZoomTo(next, null, tapX);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = tapX;
          }
        }
      }

      window.addEventListener('pointerup', onPointerEnd);
      window.addEventListener('pointercancel', onPointerEnd);

      // 桌面端：滚轮横移，Ctrl/⌘ + 滚轮（触控板捏合）缩放
      viewportEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          const rect = viewportEl.getBoundingClientRect();
          setZoomScaleAnchored(state.zoomScale - e.deltaY * 0.004, e.clientX - rect.left);
        } else {
          state.scrollX += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.9;
          applyScrollTransform();
        }
      }, { passive: false });

      // 屏蔽 iOS 整页捏合/双击缩放
      viewportEl.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    }

    /********************************************************************
     * 13. 控制栏交互
     ********************************************************************/
    function initControls() {
      const toggleBtn = document.getElementById('toggle-events-btn');
      toggleBtn.addEventListener('click', () => {
        state.showEventsMaster = !state.showEventsMaster;
        toggleBtn.setAttribute('aria-checked', String(state.showEventsMaster));
        toggleBtn.classList.toggle('on', state.showEventsMaster);

        // 开启事件但当前缩放低于 80% 时，自动柔和放大到 100%
        if (state.showEventsMaster && state.zoomScale < EVENT_UNFOLD_THRESHOLD) {
          animateZoomTo(1.00);
        } else {
          updateCanvasLayout();
        }
      });

      document.querySelectorAll('.cat-pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeCategory = btn.dataset.cat;
          document.querySelectorAll('.cat-pill').forEach((b) => {
            b.classList.toggle('active', b.dataset.cat === state.activeCategory);
          });
          buildHistoricalEventElements();
          updateCanvasLayout();
        });
      });

      document.getElementById('zoom-in-btn').addEventListener('click', () => {
        animateZoomTo(Math.round((state.zoomScale + 0.20) * 20) / 20);
      });

      document.getElementById('zoom-out-btn').addEventListener('click', () => {
        animateZoomTo(Math.round((state.zoomScale - 0.20) * 20) / 20);
      });

      document.getElementById('prev-event-btn').addEventListener('click', () => {
        const list = HISTORICAL_EVENTS.filter((ev) =>
          state.activeCategory === 'all' || ev.category === state.activeCategory
        );
        if (!list.length) return;
        const idx = list.findIndex((e) => e.id === state.selectedEventId);
        const prevIdx = idx > 0 ? idx - 1 : list.length - 1;
        selectHistoricalEvent(list[prevIdx].id, true);
      });

      document.getElementById('next-event-btn').addEventListener('click', () => {
        const list = HISTORICAL_EVENTS.filter((ev) =>
          state.activeCategory === 'all' || ev.category === state.activeCategory
        );
        if (!list.length) return;
        const idx = list.findIndex((e) => e.id === state.selectedEventId);
        const nextIdx = idx < list.length - 1 ? idx + 1 : 0;
        selectHistoricalEvent(list[nextIdx].id, true);
      });
    }

    /********************************************************************
     * 14. 视口变化（旋转屏幕 / 分屏 / Safari 工具栏收缩）
     ********************************************************************/
    function handleViewportResize() {
      if (document.body.dataset.view && document.body.dataset.view !== 'scroll') return;
      const centerYear = xToYear(state.scrollX + viewportEl.clientWidth / 2);
      recomputeGeometry();
      updateCanvasLayout();
      state.scrollX = clampScrollX(yearToX(centerYear) - viewportEl.clientWidth / 2);
      applyScrollTransform();
    }

    let resizeRaf = null;
    function scheduleResize() {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        resizeRaf = null;
        handleViewportResize();
      });
    }

    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', () => setTimeout(scheduleResize, 260));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

    if ('ResizeObserver' in window) {
      new ResizeObserver(() => scheduleResize()).observe(viewportEl);
    }

    // iOS：阻止整页双指缩放与手势缩放
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    });

    /********************************************************************
     * 15. 启动
     ********************************************************************/
    function boot() {
      renderQuickNav();
      initNavScroll();
      initViews();
      buildCanvasElementsOnce();
      recomputeGeometry();
      updateCanvasLayout();
      initTimelineGestures();
      initControls();

      selectHistoricalEvent('e15', false);
      centerOnYear(235, false);
      scrollActiveNavIntoView('sanguo');

      // 字体加载 / 动态视口稳定后再校准一次
      requestAnimationFrame(() => {
        recomputeGeometry();
        updateCanvasLayout();
        applyScrollTransform();
      });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          recomputeGeometry();
          updateCanvasLayout();
          applyScrollTransform();
        });
      }
    }


      /********************************************************************
     * 16. 多页面视图：长卷 / 帝王档案 / 事件年表
     ********************************************************************/
    const VIEW_ELS = {
      scroll: document.getElementById('view-scroll'),
      archive: document.getElementById('view-archive'),
      events: document.getElementById('view-events')
    };

    let currentView = 'scroll';
    let archiveDynId = null;
    let eventQuery = '';
    let eventFilter = 'all';
    let activeDynRange = null;

    function dynastyForYear(y) {
      for (let i = MACRO_DYNASTIES.length - 1; i >= 0; i--) {
        if (y >= MACRO_DYNASTIES[i].start) return MACRO_DYNASTIES[i];
      }
      return MACRO_DYNASTIES[0];
    }

    function switchView(name) {
      if (!VIEW_ELS[name]) return;
      currentView = name;
      Object.keys(VIEW_ELS).forEach((k) => {
        VIEW_ELS[k].classList.toggle('active', k === name);
      });
      document.querySelectorAll('.view-tab').forEach((b) => {
        const on = b.dataset.view === name;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', String(on));
      });
      document.body.dataset.view = name;

      if (name === 'scroll') {
        // 从隐藏状态恢复时，画布高度为 0，必须重算纵向几何
        requestAnimationFrame(() => {
          recomputeGeometry();
          updateCanvasLayout();
          applyScrollTransform();
        });
      } else if (name === 'archive') {
        renderArchive(archiveDynId || state.activeDynastyId || 'sanguo');
      } else if (name === 'events') {
        renderEventList();
      }
    }

    /* ---------------- 档案页 ---------------- */
    function buildArchiveRail() {
      const rail = document.getElementById('archive-rail');
      rail.innerHTML = '';
      DYNASTY_ARCHIVES.forEach((arc) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rail-item';
        btn.dataset.archId = arc.id;
        btn.innerHTML = `<span class="r-name">${arc.name}</span><span class="r-range">${arc.range}</span>`;
        btn.addEventListener('click', () => renderArchive(arc.id));
        rail.appendChild(btn);
      });
    }

    function renderArchive(id) {
      const arc = ARCHIVE_MAP[id] || DYNASTY_ARCHIVES[0];
      archiveDynId = arc.id;

      document.querySelectorAll('.rail-item').forEach((b) => {
        b.classList.toggle('active', b.dataset.archId === arc.id);
      });
      const activeRail = document.querySelector('.rail-item.active');
      if (activeRail && activeRail.scrollIntoView) {
        activeRail.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }

      const totalRulers = arc.groups.reduce((n, g) => n + g.rulers.length, 0);
      const mac = MACRO_DYNASTIES.find((d) => d.id === arc.id);
      const midYear = mac ? Math.round((mac.start + mac.end) / 2) : null;

      const groupsHtml = arc.groups.map((g) => {
        const rows = g.rulers.map((r) => {
          const jump = typeof r.y === 'number'
            ? `<button class="emp-jump" type="button" data-year="${r.y}">长卷定位</button>`
            : '<span></span>';
          return `
            <div class="emp-row">
              <div class="emp-id">
                <span class="emp-name">${r.n}</span>
                <span class="emp-reign">${r.r}</span>
              </div>
              <p class="emp-deed">${r.d}</p>
              ${jump}
            </div>`;
        }).join('');
        return `${g.g ? `<div class="group-head">${g.g}</div>` : ''}${rows}`;
      }).join('');

      const figsHtml = arc.figures.map((f) => `
        <div class="fig-card">
          <div class="fig-name">${f.n}</div>
          <span class="fig-role">${f.r}</span>
          <p class="fig-note">${f.d}</p>
        </div>`).join('');

      const body = document.getElementById('archive-body');
      body.innerHTML = `
        <div class="arch-hero">
          <div class="arch-hero-top">
            <h2 class="arch-name">${arc.name}</h2>
            <span class="arch-years">${arc.range}</span>
          </div>
          <div class="arch-meta">
            <span>都城 <b>${arc.capital}</b></span>
            <span>开国 <b>${arc.founder}</b></span>
            <span>${arc.rulerLabel} <b>${totalRulers}</b> 位</span>
            <span>人物 <b>${arc.figures.length}</b> 位</span>
          </div>
          <p class="arch-intro">${arc.intro}</p>
          <div class="arch-actions">
            ${midYear !== null ? `<button class="ghost-btn" type="button" data-jump="${midYear}">在长卷中查看该朝 ›</button>` : ''}
            ${mac ? '<button class="ghost-btn" type="button" data-events="1">该朝事件一览 ›</button>' : ''}
          </div>
        </div>

        <div class="arch-section">
          <h3>${arc.rulerLabel}世系</h3>
          <span class="count">${totalRulers} 位</span>
        </div>
        ${groupsHtml}

        <div class="arch-section">
          <h3>历史人物</h3>
          <span class="count">${arc.figures.length} 位</span>
        </div>
        <div class="fig-grid">${figsHtml}</div>
      `;

      body.scrollTop = 0;

      body.querySelectorAll('.emp-jump').forEach((btn) => {
        btn.addEventListener('click', () => jumpToYear(Number(btn.dataset.year)));
      });
      const jumpBtn = body.querySelector('[data-jump]');
      if (jumpBtn) jumpBtn.addEventListener('click', () => jumpToYear(Number(jumpBtn.dataset.jump)));
      const evBtn = body.querySelector('[data-events]');
      if (evBtn) {
        evBtn.addEventListener('click', () => {
          if (mac) {
            activeDynRange = {
              start: mac.start,
              end: mac.end,
              name: mac.name.replace('(春秋战国)', '')
            };
            state.activeDynastyId = mac.id;
          }
          switchView('events');
        });
      }
    }

    /* ---------------- 事件页 ---------------- */
    function syncDynChip() {
      const chips = document.getElementById('event-chips');
      const existing = chips.querySelector('[data-dyn-chip]');
      if (!activeDynRange) {
        if (existing) existing.remove();
        return;
      }
      const label = `朝代：${activeDynRange.name} ×`;
      if (existing) { existing.textContent = label; return; }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fchip active';
      btn.dataset.dynChip = '1';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        activeDynRange = null;
        syncDynChip();
        renderEventList();
      });
      chips.insertBefore(btn, chips.firstChild);
    }

    function renderEventList() {
      syncDynChip();
      const list = document.getElementById('events-list');
      const q = eventQuery.trim().toLowerCase();

      const items = HISTORICAL_EVENTS.filter((ev) => {
        if (eventFilter !== 'all' && ev.category !== eventFilter) return false;
        if (activeDynRange && (ev.year < activeDynRange.start || ev.year > activeDynRange.end)) return false;
        if (!q) return true;
        const hay = `${ev.year} ${ev.shortTitle} ${ev.title} ${ev.period} ${ev.figure} ${ev.desc} ${ev.detail || ''}`.toLowerCase();
        return hay.includes(q);
      });

      document.getElementById('events-count').textContent = `共 ${items.length} 条`;

      if (!items.length) {
        list.innerHTML = '<div class="empty-tip">没有匹配的历史事件，换个关键词试试</div>';
        return;
      }

      let html = '';
      let lastDynId = null;
      items.forEach((ev) => {
        const mac = dynastyForYear(ev.year);
        if (mac && mac.id !== lastDynId) {
          html += `<div class="ev-group">${mac.name.replace('(春秋战国)', '')}<span class="g-range">${mac.period}</span></div>`;
          lastDynId = mac.id;
        }
        const y = ev.year < 0 ? `前${Math.abs(ev.year)}` : `${ev.year}`;
        html += `
          <div class="ev-row" data-year="${ev.year}" data-event="${ev.id}">
            <span class="ev-year">${y}</span>
            <div class="ev-main">
              <div class="ev-title">${ev.title}</div>
              <div class="ev-sub">${ev.period} · ${ev.figure}</div>
            </div>
            <span class="ev-cat" data-cat="${ev.category}">${ev.category}</span>
          </div>`;
      });

      list.innerHTML = html;
      list.scrollTop = 0;
      list.querySelectorAll('.ev-row').forEach((row) => {
        row.addEventListener('click', () => {
          jumpToYear(Number(row.dataset.year), row.dataset.event);
        });
      });
    }

    /* ---------------- 跨页联动 ---------------- */
    function jumpToYear(year, eventId) {
      switchView('scroll');
      requestAnimationFrame(() => {
        if (state.zoomScale < EVENT_UNFOLD_THRESHOLD) state.zoomScale = 1.0;
        updateCanvasLayout();
        applyScrollTransform();
        if (eventId) {
          selectHistoricalEvent(eventId, true);
        } else {
          centerOnYear(year, true);
        }
      });
    }

    function initViews() {
      buildArchiveRail();

      document.querySelectorAll('.view-tab').forEach((btn) => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      document.getElementById('open-archive-btn').addEventListener('click', () => {
        if (ARCHIVE_MAP[state.activeDynastyId]) archiveDynId = state.activeDynastyId;
        switchView('archive');
      });

      const search = document.getElementById('event-search');
      const box = document.getElementById('search-box');
      const clearBtn = document.getElementById('search-clear');

      search.addEventListener('input', () => {
        eventQuery = search.value;
        box.classList.toggle('has-value', !!search.value);
        renderEventList();
      });
      clearBtn.addEventListener('click', () => {
        search.value = '';
        eventQuery = '';
        box.classList.remove('has-value');
        renderEventList();
        search.focus();
      });

      document.querySelectorAll('.fchip').forEach((btn) => {
        if (btn.dataset.dynChip) return;
        btn.addEventListener('click', () => {
          eventFilter = btn.dataset.cat;
          document.querySelectorAll('.fchip').forEach((b) => {
            if (b.dataset.dynChip) return;
            b.classList.toggle('active', b.dataset.cat === eventFilter);
          });
          renderEventList();
        });
      });

      // 预渲染，避免首次切换出现空白
      renderArchive(archiveDynId || state.activeDynastyId || 'sanguo');
      document.body.dataset.view = 'scroll';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
